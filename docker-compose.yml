networks:
  cdc-network:
    driver: bridge

volumes:
  pg-data:
  kafka-data:
  minio-data:
  trino-data:
  superset-data:

services:

  # ── 1. MinIO : stockage objet S3 ──────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_REGION: us-east-1
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [cdc-network]

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/setup-minio.sh"]
    volumes:
      - ./infra/minio/setup-minio.sh:/scripts/setup-minio.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    networks: [cdc-network]
    restart: "no"

  # ── 2. PostgreSQL : base source CDC ───────────────────────
  postgres:
    build:
      context: ./infra/postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-metastore}
      POSTGRES_CDC_USER: ${POSTGRES_CDC_USER:-cdc_reader}
      POSTGRES_CDC_PASSWORD: ${POSTGRES_CDC_PASSWORD:-cdc_reader_pwd}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
      - -c
      - wal_keep_size=256MB
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-admin}", "-d", "${POSTGRES_DB:-metastore}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [cdc-network]

  # ── 3. Kafka : bus d'événements CDC ───────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "cdc-lakehouse-cluster-01"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [cdc-network]

  # ── 4. Kafka UI : interface web de monitoring ─────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cdc-lakehouse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks: [cdc-network]

  # ── 5. Schema Registry : stocke les schémas Avro ──────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks: [cdc-network]

  # ── 6. Debezium : capture CDC ─────────────────────────────
  debezium:
    build:
      context: ./infra/debezium
    container_name: debezium
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-cdc-group
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      DEBEZIUM_CONNECTOR_CONFIG_DIR: /kafka/connectors
    volumes:
      - ./infra/debezium/config:/kafka/connectors:ro
      - ./infra/debezium/start-with-connectors.sh:/start-with-connectors.sh:ro
    entrypoint: ["/bin/bash", "/start-with-connectors.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks: [cdc-network]

  # ── 7. Hive Metastore : catalogue Iceberg ─────────────────
  hive-metastore:
    build:
      context: ./infra/hive-metastore
    container_name: hive-metastore
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      DB_DRIVER: postgres
      SERVICE_NAME: metastore
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9083 2>/dev/null && echo OK || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks: [cdc-network]

  # ── 8. Spark Master ───────────────────────────────────────
  spark-master:
    build:
      context: ./infra/spark
    container_name: spark-master
    hostname: spark-master
    command: /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8888:8888"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8888
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - ./jobs/spark:/opt/spark/jobs
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    networks: [cdc-network]

  # ── 9. Spark Worker 1 ─────────────────────────────────────
  spark-worker-1:
    build:
      context: ./infra/spark
    container_name: spark-worker-1
    command: /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - ./jobs/spark:/opt/spark/jobs
    depends_on: [spark-master]
    networks: [cdc-network]

  # ── 10. Spark Worker 2 ────────────────────────────────────
  spark-worker-2:
    build:
      context: ./infra/spark
    container_name: spark-worker-2
    command: /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - ./jobs/spark:/opt/spark/jobs
    depends_on: [spark-master]
    networks: [cdc-network]

  # ── 11. Trino : moteur SQL distribué ─────────────────────
  trino:
    image: trinodb/trino:435
    container_name: trino
    ports:
      - "8080:8080"
    depends_on:
      hive-metastore:
        condition: service_healthy
    volumes:
      - ./infra/trino/config:/etc/trino
      - trino-data:/var/trino/data
    user: "0:0"
    networks: [cdc-network]

  # ── 12. Superset : dashboards ─────────────────────────────
  superset:
    build:
      context: ./infra/superset
    container_name: superset
    ports:
      - "8088:8088"
    depends_on: [trino, postgres]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-cdc-lakehouse-secret}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@local.com}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres/${POSTGRES_DB:-metastore}
    volumes:
      - superset-data:/app/superset_home
      - ./infra/superset/provisioning:/app/docker/docker-init.d
    networks: [cdc-network]

  # ── 13. Data Generator (optionnel) ────────────────────────
  data-generator:
    build:
      context: ./data-generator
    container_name: data-generator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER:-admin}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      PG_DBNAME: retail
      SEED_CUSTOMERS: 200
      SEED_PRODUCTS: 100
      SIMULATION_RATE_MS: 500
    networks: [cdc-network]
    profiles: [generator]
    restart: "no"
